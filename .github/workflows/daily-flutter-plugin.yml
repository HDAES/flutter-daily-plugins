name: Daily Flutter Plugin

on:
  # 01:17 UTC = 09:17 Beijing. Non-round minute reduces scheduler congestion.
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Optional Day number (2-100); blank means today in Beijing'
        required: false
        type: string
        default: ''
      publish:
        description: 'Commit to main after checks pass? (unchecked = validate only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: flutter-daily-plugin
  cancel-in-progress: false

# Default GITHUB_TOKEN access stays read-only; only publish can write.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      day: ${{ steps.plan.outputs.day }}
      target: ${{ steps.plan.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine the next project from ROADMAP.md
        id: plan
        env:
          REQUESTED_DAY: ${{ inputs.day || '' }}
        shell: bash
        run: |
          python3 scripts/daily_plugin.py plan --day "$REQUESTED_DAY"

  generate:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate plugin via OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          DAY: ${{ needs.plan.outputs.day }}
        run: |
          python3 scripts/daily_plugin.py generate --day "$DAY" --output-root generated
      - uses: actions/upload-artifact@v4
        with:
          name: generated-day-${{ needs.plan.outputs.day }}
          path: generated/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: [plan, generate]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: generated-day-${{ needs.plan.outputs.day }}
          path: .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install, format, analyze and test WITHOUT API secrets or write token
        shell: bash
        env:
          TARGET: ${{ needs.plan.outputs.target }}
        run: |
          set -euo pipefail
          cd "$TARGET"
          flutter --version
          flutter pub get
          (cd example && flutter pub get)
          dart format lib test example/lib
          flutter analyze
          flutter test
          (cd example && flutter analyze)
      - uses: actions/upload-artifact@v4
        with:
          name: validated-day-${{ needs.plan.outputs.day }}
          path: ${{ needs.plan.outputs.target }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, validate]
    # On schedule publish automatically. Manual dispatch defaults to validate-only.
    if: needs.plan.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: validated-day-${{ needs.plan.outputs.day }}
          path: ${{ needs.plan.outputs.target }}/
      - name: Commit only the verified new plugin and index
        env:
          DAY: ${{ needs.plan.outputs.day }}
          TARGET: ${{ needs.plan.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Avoid clobbering changes that landed during generation/tests.
          git fetch origin main
          git merge --ff-only origin/main
          if git ls-tree -d --name-only HEAD | grep -Fx -- "$TARGET"; then
            echo "Already submitted: $TARGET"
            exit 0
          fi
          python3 scripts/daily_plugin.py record --day "$DAY"
          git add -- "$TARGET" README.md ROADMAP.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(day-${DAY}): add daily Flutter plugin"
          git push origin HEAD:main